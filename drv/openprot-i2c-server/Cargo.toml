[package]
name = "drv-openprot-i2c-server"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "drv-openprot-i2c-server"
path = "src/main.rs"


[dependencies]
bitfield = { workspace = true }
cortex-m = { workspace = true }
embedded-hal = { workspace = true }
zerocopy = { workspace = true }
zerocopy-derive = { workspace = true }
heapless = { workspace = true }

drv-i2c-api = { path = "../i2c-api" }
drv-i2c-types = { path = "../i2c-types" }
ringbuf = { path = "../../lib/ringbuf" }
counters = { path = "../../lib/counters" }
userlib = { path = "../../sys/userlib" }
fixedmap = { path = "../../lib/fixedmap" }

# Hardware vendor dependencies (conditionally compiled)
# Each vendor adds their dependencies with optional = true
drv-ast1060-i2c = { path = "../ast1060-i2c", optional = true }
ast1060-pac = { workspace = true, optional = true }

# Future vendors would add:
# drv-stm32-i2c = { path = "../stm32-i2c", optional = true }
# stm32-pac = { ... , optional = true }

[features]
# Default: AST1060 hardware (can be changed based on target platform)
default = ["ast1060"]

# Hardware vendor features (mutually exclusive - select one)
ast1060 = ["drv-ast1060-i2c", "ast1060-pac"]
# Future: stm32 = ["drv-stm32-i2c", "stm32-pac"]
# Future: lpc55 = ["drv-lpc55-i2c", "lpc55-pac"]

# Functional features (work with any hardware)
slave = ["drv-ast1060-i2c?/slave"]  # Pass through slave feature to hardware driver

[build-dependencies]
build-util = { path = "../../build/util" }

[lints]
workspace = true